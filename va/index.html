<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Truth－基於大數據之廣告行銷的稽核平台</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#45bff5;--blue-dark:#16668d;--sky:#bfeeff;--white:#ffffff;
  --glass:rgba(255,255,255,.68);--glass-light:rgba(255,255,255,.38);
  --text:#17425c;--muted:#5f7f92;
  --safe:#16a34a;--safe-bg:rgba(34,197,94,.14);--safe-border:rgba(34,197,94,.26);
  --danger:#be123c;--danger-bg:rgba(251,113,133,.14);--danger-border:rgba(251,113,133,.26);
  --warn:#b45309;--warn-bg:rgba(245,158,11,.14);--warn-border:rgba(245,158,11,.28);
  --neutral:#0369a1;--neutral-bg:rgba(56,189,248,.14);--neutral-border:rgba(56,189,248,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100vh;font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;color:var(--text);overflow-x:hidden;background:#eaf9ff;font-size:15px}

/* ── HERO ── */
.hero{
  position:relative;min-height:100vh;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.18) 36%,rgba(120,215,255,.18) 100%),
    radial-gradient(circle at 80% 15%,rgba(255,255,255,.95),transparent 26%),
    linear-gradient(135deg,#c9eeff 0%,#e8f9ff 50%,#b8eaff 100%);
  background-size:cover;background-position:center;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.8),transparent 20%),
    linear-gradient(135deg,rgba(255,255,255,.18),rgba(61,190,240,.14));
  pointer-events:none;z-index:1;
}
.hero::after{
  content:'';position:absolute;right:-120px;top:-80px;width:620px;height:130vh;
  background:linear-gradient(135deg,rgba(74,197,245,.78),rgba(118,225,255,.5));
  clip-path:polygon(30% 0,100% 0,72% 100%,0 100%);
  z-index:1;opacity:.72;
}
.sparkle{position:absolute;width:6px;height:6px;background:white;border-radius:50%;box-shadow:0 0 10px white,0 0 18px rgba(255,255,255,.8);animation:twinkle 2.6s infinite ease-in-out;z-index:3}
.s1{right:18%;top:18%;animation-delay:.1s}.s2{right:12%;top:33%;animation-delay:.5s}
.s3{right:24%;top:48%;animation-delay:.9s}.s4{right:8%;top:62%;animation-delay:1.2s}
.s5{right:32%;top:28%;animation-delay:1.5s}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1.5);opacity:1}}

/* ── HEADER ── */
.header{position:fixed;top:0;left:0;width:100%;padding:26px 34px;z-index:20;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.logo{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.54);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.68);box-shadow:0 12px 28px rgba(38,145,190,.16);font-weight:900;font-size:18px;color:#247aa3;letter-spacing:-1px}
.logo-icon{width:34px;height:34px;display:grid;place-items:center}.logo-icon img{display:block;width:34px;height:34px}
.nav{position:absolute;top:24px;left:50%;transform:translateX(-50%);pointer-events:auto;display:flex;align-items:center;gap:4px;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.62);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.78);box-shadow:0 14px 36px rgba(49,142,183,.2),inset 0 1px 0 rgba(255,255,255,.8)}
.nav a{display:flex;align-items:center;gap:7px;text-decoration:none;color:#1f5d7d;font-size:16px;font-weight:900;padding:10px 18px;border-radius:999px;transition:.25s;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.72);color:#0797d4;transform:translateY(-1px)}
.menu-btn{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#40c7ff,#2cb2ea);color:white;display:grid;place-items:center;box-shadow:0 14px 28px rgba(32,149,206,.35),inset 0 1px 0 rgba(255,255,255,.4);transition:.25s}
.menu-btn:hover{transform:translateY(-2px) scale(1.04)}

/* ── HERO CONTENT ── */
.hero-content{position:relative;z-index:5;min-height:100vh;padding:150px 7% 80px;display:flex;align-items:center}
.intro-panel{width:min(540px,100%);margin-top:40px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.86);color:#1d7198;font-size:13px;font-weight:900;letter-spacing:1px;box-shadow:0 10px 26px rgba(44,145,190,.13);margin-bottom:22px}
.title{font-size:clamp(38px,5vw,58px);line-height:1.04;letter-spacing:-2px;font-weight:900;color:#185b7c;text-shadow:0 4px 0 rgba(255,255,255,.72),0 12px 24px rgba(41,126,166,.18);margin-bottom:18px}
.title span{color:#37bdf2}
.subtitle{font-size:17px;line-height:1.9;color:#446f86;font-weight:700;margin-bottom:28px}
.scanner-card{position:relative;width:min(620px,100%);padding:20px;border-radius:30px;background:rgba(255,255,255,.72);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.86);box-shadow:0 24px 54px rgba(34,122,164,.2),inset 0 1px 0 rgba(255,255,255,.9)}
.scanner-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding:0 4px}
.scanner-title strong{color:#1e6c90;font-size:15px}
.scanner-title span{font-size:12px;font-weight:900;color:#20a7df;background:rgba(69,191,245,.12);border:1px solid rgba(69,191,245,.2);padding:7px 10px;border-radius:999px}
.search-box{display:flex;gap:12px}
.search-box input{flex:1;border:none;outline:none;border-radius:20px;padding:17px 19px;background:rgba(255,255,255,.82);border:1px solid rgba(87,179,220,.22);color:#17425c;font-size:15px;font-weight:700}
.search-box input::placeholder{color:#8baabd}
.search-box input:focus{border-color:#45bff5;box-shadow:0 0 0 4px rgba(69,191,245,.14)}
.search-box button{border:none;cursor:pointer;border-radius:20px;padding:0 28px;color:white;font-size:15px;font-weight:900;background:linear-gradient(135deg,#58d4ff,#28aee8);box-shadow:0 12px 24px rgba(40,174,232,.34),inset 0 1px 0 rgba(255,255,255,.45);transition:.25s;white-space:nowrap}
.search-box button:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(40,174,232,.45)}
#loading{display:none;margin-top:14px;color:#259ac9;font-size:14px;font-weight:900;letter-spacing:1px;animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.scroll-down{position:absolute;z-index:6;left:50%;bottom:28px;transform:translateX(-50%);width:42px;height:42px;display:grid;place-items:center;color:#1d7198;opacity:1;font-size:32px;animation:downFloat 1.6s infinite ease-in-out}
@keyframes downFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* ── RESULT SECTION ── */
.result-section{position:relative;z-index:8;padding:70px 6%;background:linear-gradient(180deg,#eaf9ff,#ffffff)}
.result-wrapper{display:none;max-width:1180px;margin:0 auto;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.result-header{text-align:center;margin-bottom:28px}
.result-header h2{font-size:clamp(24px,4vw,36px);font-weight:900;color:#1b6386;margin-bottom:10px}
.result-header p{color:#6d91a6;font-weight:700}

/* ── VERDICT PANEL ── */
.verdict-panel{position:relative;overflow:hidden;padding:42px;border-radius:34px;text-align:center;background:rgba(255,255,255,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.9);box-shadow:0 24px 58px rgba(47,136,177,.18);margin-bottom:24px}
.verdict-panel::before{content:'';position:absolute;inset:-80px;background:radial-gradient(circle at 20% 20%,rgba(90,210,255,.25),transparent 30%),radial-gradient(circle at 80% 10%,rgba(255,204,112,.2),transparent 24%);pointer-events:none}
.verdict-content{position:relative;z-index:2}
.verdict-badge{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(69,191,245,.2);color:#1d7198;font-size:20px;font-weight:900;margin-bottom:16px}
.target-url{display:inline-block;max-width:100%;word-break:break-all;color:#63889d;background:rgba(240,250,255,.78);padding:12px 20px;border-radius:16px;font-size:14px;font-weight:700;margin-bottom:18px}
#scoreLabel{font-size:clamp(64px,10vw,88px);font-weight:900;letter-spacing:-4px;margin:8px 0;text-shadow:0 5px 0 rgba(255,255,255,.9),0 14px 26px rgba(61,154,196,.15)}
.glow-bar-bg{width:100%;max-width:720px;height:18px;margin:24px auto;border-radius:999px;overflow:hidden;background:rgba(211,238,249,.8);border:1px solid rgba(255,255,255,.9)}
.glow-bar-fill{height:100%;width:0%;border-radius:999px;transition:1.2s cubic-bezier(.25,1,.5,1)}
.source-tag{color:#6c8da1;font-size:14px;font-weight:900;letter-spacing:.6px;margin-top:10px}

/* ── AUDIT PANEL ── */
.audit-panel{padding:32px;border-radius:32px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 42px rgba(47,136,177,.13)}
.panel-section-title{font-size:22px;font-weight:900;color:#1b6386;margin-bottom:8px}
.panel-section-sub{font-size:13px;color:#6d91a6;font-weight:700;margin-bottom:24px}

/* ── 特徵卡片 Grid ── */
.features-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}

.feature-card{
  padding:20px 22px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(239,250,255,.82));
  border:1px solid rgba(69,191,245,.18);
  box-shadow:0 8px 22px rgba(47,136,177,.08);
  transition:.25s;display:flex;flex-direction:column;gap:4px;
}
.feature-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(47,136,177,.16);border-color:rgba(69,191,245,.36)}

.feature-key{font-size:11px;color:#40a7cf;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.feature-title{font-size:15px;font-weight:900;color:#245d79;margin-bottom:6px}
.feature-desc{font-size:12.5px;line-height:1.65;color:var(--muted);font-weight:700;margin-bottom:10px}
.feature-value-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:auto}
.feature-value{font-size:28px;font-weight:900;color:#17425c;letter-spacing:-1px;white-space:nowrap}
.feature-status{font-size:12px;font-weight:900;padding:6px 12px;border-radius:999px;white-space:nowrap;align-self:flex-end}

/* ── 狀態顏色 ── */
.status-alert{color:var(--danger);background:var(--danger-bg);border:1px solid var(--danger-border)}
.status-safe{color:var(--safe);background:var(--safe-bg);border:1px solid var(--safe-border)}
.status-warn{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-border)}
.status-neutral{color:var(--neutral);background:var(--neutral-bg);border:1px solid var(--neutral-border)}

/* ── AI 摘要 ── */
.ai-summary{
  margin-top:24px;padding:26px 30px;border-radius:24px;
  background:linear-gradient(135deg,rgba(224,245,255,.82),rgba(240,252,255,.92));
  border:1px solid rgba(69,191,245,.22);
  box-shadow:0 10px 28px rgba(47,136,177,.1);
}
.ai-summary-title{font-size:14px;font-weight:900;color:#1d7198;margin-bottom:12px;letter-spacing:.5px}
.ai-summary-body{font-size:15px;line-height:1.85;color:#2e5f7a;font-weight:700}
.ai-summary-body strong{color:#e05050}
.ai-highlight{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ai-chip{font-size:12px;font-weight:900;padding:6px 14px;border-radius:999px}
.chip-danger{color:var(--danger);background:var(--danger-bg);border:1px solid var(--danger-border)}
.chip-safe{color:var(--safe);background:var(--safe-bg);border:1px solid var(--safe-border)}
.chip-warn{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-border)}

/* ── 回報按鈕 ── */
.feedback-row{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.feedback-label{font-size:13px;font-weight:900;color:#6d91a6}
.btn-fb{font-size:13px;font-weight:900;padding:10px 20px;border-radius:999px;border:none;cursor:pointer;transition:.2s}
.btn-fb:hover{transform:translateY(-2px)}
.btn-scam{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.btn-safe{background:var(--safe-bg);color:var(--safe);border:1px solid var(--safe-border)}
.btn-fb:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-fb.done,.btn-fb.done:disabled{opacity:1;background:var(--safe-bg);color:var(--safe);border:1px solid var(--safe-border)}
.btn-fb.fail,.btn-fb.fail:disabled{opacity:1;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}

/* ── 圖示（icons.js：24×24 線條、currentColor）── */
.ic{flex:none;display:inline-block}
.ic-lead{vertical-align:-.18em;margin-right:.4em}
.logo-icon{color:#16668d}
.nav a .ic{color:#2a7ea6;transition:color .25s}
.nav a:hover .ic{color:#0797d4}
.badge .ic{color:#2a7ea6}
.scanner-title strong{display:inline-flex;align-items:center;gap:8px}
.scanner-title strong .ic{color:#2a7ea6}
.scanner-title span{display:inline-flex;align-items:center;gap:6px}
#loading .ic{color:#2a7ea6;vertical-align:-.2em;margin-right:6px}
.scroll-down .ic{filter:drop-shadow(0 4px 10px rgba(42,126,166,.2))}
.result-header h2{display:flex;align-items:center;justify-content:center;gap:12px}
.result-header h2 .ic{color:#2a7ea6}
.verdict-badge{gap:10px}
.target-url .ic{color:#2a7ea6;vertical-align:-.2em;margin-right:8px}
.source-tag .src-ic{vertical-align:-.2em;margin-right:6px}
.src-inline{display:inline-flex;align-items:center;gap:5px;vertical-align:baseline;font-weight:900}
.src-inline .ic{vertical-align:-.15em}
.panel-section-title{display:flex;align-items:center;gap:10px}
.panel-section-title .ic{color:#2a7ea6}
.ai-summary-title{display:flex;align-items:center;gap:8px}
.ai-summary-title .ic{color:#2a7ea6}
.btn-fb{display:inline-flex;align-items:center;gap:7px}
.empty-note{display:flex;align-items:center;justify-content:center;gap:8px}
.feature-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:34px}
.feature-ico{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:10px}
.feature-head .feature-key{margin-bottom:0;min-width:0;overflow-wrap:anywhere;line-height:1.35}
/* v7：特徵數量動態顯示、降級模式提示、版本標籤、通用特徵卡片 */
[data-feature-count]{margin:0 .25em}
.degraded-note{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;width:fit-content;max-width:100%;margin:10px auto 0;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-border)}
.degraded-note .ic{flex:none}
.ver-tag{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.4px;color:#8baabd}
.feature-generic{border-style:dashed}

@media(max-width:900px){
  .nav{display:none}.header{padding:18px}.logo{font-size:15px}
  .hero-content{padding:130px 6% 90px;align-items:flex-end}
  .intro-panel{width:100%;margin-top:0}
  .title{font-size:38px}.subtitle{font-size:15px}
  .search-box{flex-direction:column}.search-box button{height:54px}
  .hero::after{opacity:.42;right:-260px}
  #scoreLabel{font-size:64px}.verdict-panel{padding:28px 18px}.audit-panel{padding:20px}
  .features-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
</style>
</head>
